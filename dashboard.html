<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KSA Jobs</title>
  <style>
    :root { --green: #0f6b4c; --ink: #14221c; --muted: #5c6b64; --line: #e4ebe7; --bg: #f4f7f5; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
    header { background: var(--green); color: #fff; padding: 20px 24px; }
    header h1 { margin: 0 0 4px; font-size: 1.4rem; }
    header p { margin: 0; opacity: 0.9; }
    main { max-width: 1100px; margin: 0 auto; padding: 20px; }
    form { display: flex; flex-wrap: wrap; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: var(--muted); }
    input, select, button { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); }
    button { background: var(--green); color: #fff; border: 0; cursor: pointer; }
    button.secondary { background: #fff; color: var(--green); border: 1px solid var(--green); }
    #status { margin: 12px 0; color: var(--muted); }
    .job { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
    .job h2 { margin: 0 0 4px; font-size: 1.05rem; }
    .meta { color: var(--muted); font-size: 0.9rem; }
    a { color: var(--green); }
  </style>
</head>
<body>
  <header>
    <h1>Saudi Arabia jobs</h1>
    <p>Indeed, LinkedIn, Bayt, and Google Jobs, saved in ksajob.</p>
  </header>
  <main>
    <form id="filters">
      <label>Keywords <input id="keywords" placeholder="accountant, nurse, python" /></label>
      <label>Region
        <select id="region">
          <option value="All">All regions</option>
          <option value="Remote">Remote</option>
          <option>Riyadh</option>
          <option>Makkah</option>
          <option>Madinah</option>
          <option>Eastern Province</option>
          <option>Qassim</option>
          <option>Asir</option>
          <option>Tabuk</option>
          <option>Hail</option>
          <option>Northern Borders</option>
          <option>Jazan</option>
          <option>Najran</option>
          <option>Al Bahah</option>
          <option>Al Jawf</option>
        </select>
      </label>
      <label>City <input id="city" placeholder="Jeddah" /></label>
      <label>Board
        <select id="platform">
          <option value="All">All</option>
          <option>Indeed</option>
          <option>LinkedIn</option>
          <option>Bayt</option>
          <option>Google Jobs</option>
          <option>Dev Global Jobs</option>
        </select>
      </label>
      <label>Posted
        <select id="days">
          <option value="0" selected>All</option>
          <option value="1">1 day</option>
          <option value="7">7 days</option>
        </select>
      </label>
      <button type="submit">Show jobs</button>
      <button type="button" class="secondary" id="scrape">Scrape now</button>
    </form>
    <p id="status">Loading saved jobs…</p>
    <div id="list"></div>
  </main>
  <script>
    const statusEl = document.getElementById("status");
    const listEl = document.getElementById("list");

    function params() {
      const q = new URLSearchParams({
        keywords: document.getElementById("keywords").value.trim(),
        state: document.getElementById("region").value,
        city: document.getElementById("city").value.trim(),
        platform: document.getElementById("platform").value,
        days: document.getElementById("days").value,
        limit: "50",
      });
      return q;
    }

    function render(jobs) {
      if (!jobs.length) {
        listEl.innerHTML = "<p>No Saudi listings for this filter yet.</p>";
        return;
      }
      listEl.innerHTML = jobs.map((job) => `
        <article class="job">
          <h2>${escapeHtml(job.title || "")}</h2>
          <div class="meta">${escapeHtml(job.company || "")} · ${escapeHtml(job.location || job.state || "Saudi Arabia")} · ${escapeHtml(job.platform || "")}</div>
          <div class="meta">${escapeHtml(job.daysAgo || "")}</div>
          <p><a href="${escapeHtml(job.url || "#")}" target="_blank" rel="noopener">Open listing</a></p>
        </article>
      `).join("");
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }

    async function loadJobs() {
      statusEl.textContent = "Loading…";
      const res = await fetch("/api/jobs?" + params());
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Could not load jobs");
      render(data.jobs || []);
      statusEl.textContent = `${data.total ?? 0} jobs in ksajob for this filter.`;
    }

    async function waitForScrape() {
      for (let i = 0; i < 90; i++) {
        await new Promise((r) => setTimeout(r, 4000));
        const res = await fetch("/api/scrape/status");
        const data = await res.json();
        if (!data.running) return data;
        statusEl.textContent = "Scrape is still running…";
      }
      throw new Error("Scrape is still running. Refresh in a minute.");
    }

    document.getElementById("filters").addEventListener("submit", (event) => {
      event.preventDefault();
      loadJobs().catch((err) => { statusEl.textContent = err.message; });
    });

    document.getElementById("scrape").addEventListener("click", async () => {
      statusEl.textContent = "Starting Saudi scrape…";
      const res = await fetch("/api/scrape?" + params(), { method: "POST" });
      const data = await res.json();
      if (!res.ok) {
        statusEl.textContent = data.detail || "Scrape failed";
        return;
      }
      const done = await waitForScrape();
      if (done.last_scrape && done.last_scrape.ok === false) {
        statusEl.textContent = done.last_scrape.error || "Scrape failed";
        return;
      }
      await loadJobs();
    });

    loadJobs().catch((err) => { statusEl.textContent = err.message; });
  </script>
</body>
</html>
