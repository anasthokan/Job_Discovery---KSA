$kind: collection
name: EzyJob AI Resume Generate
description: |-
  Generate a resume with the local Ollama model from facts the caller sends.
  No auth.

  Set base_url to the API host. Local default is http://127.0.0.1:9002.
  The model may rewrite the summary and experience bullets. It must not add
  employers, dates, skills, or numbers that were not in the request.
  format=pdf is the default and downloads resume.pdf. format=docx downloads
  Word. format=json returns the resume JSON.
  A 503 means Ollama is off or unreachable. Check GET /api/health field ollama.ok.
variables:
  - key: base_url
    value: 'http://127.0.0.1:9002'
    description: API host. Change this for the deployed server.
